openapi: 3.1.0
info:
  title: Stones Cry Out API
  version: 0.2.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Authoritative shared contract for the Stones Cry Out iOS and future Android
    clients. Guest identity is server-issued and does not require personal data.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://api.invalid
    description: Placeholder only; environment URLs are supplied out of band.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Return non-sensitive service health
      security: []
      responses:
        "200":
          description: Service is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/guest/session:
    post:
      operationId: createGuestSession
      summary: Create or recover an opaque guest session
      security: []
      description: >-
        Creates a guest player without email or name. Repeating a request for
        the same installation and idempotency key must not create another
        player. The server stores only a one-way installation identifier hash.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestSessionRequest"
      responses:
        "201":
          description: Guest session created or safely recovered.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._-]+$"
  headers:
    RequestId:
      description: Correlation identifier safe to include in support logs.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    IdempotencyConflict:
      description: The idempotency key was reused for a different request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Request rate exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServerError:
      description: Non-sensitive server failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    GuestSessionRequest:
      type: object
      additionalProperties: false
      required: [installationId, locale, appBuild, platform]
      properties:
        installationId:
          type: string
          format: uuid
          description: Random app-installation identifier; never a hardware identifier.
        locale:
          type: string
          minLength: 2
          maxLength: 35
          pattern: "^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
        appBuild:
          type: integer
          minimum: 1
        platform:
          type: string
          enum: [ios, android]
    SessionResponse:
      type: object
      additionalProperties: false
      required: [player, tokens]
      properties:
        player:
          $ref: "#/components/schemas/PlayerProfile"
        tokens:
          $ref: "#/components/schemas/SessionTokens"
    PlayerProfile:
      type: object
      additionalProperties: false
      required: [playerId, accountKind, createdAt, deletionState]
      properties:
        playerId:
          type: string
          format: uuid
        accountKind:
          type: string
          enum: [guest, apple, google]
        displayName:
          type: [string, "null"]
          maxLength: 50
        createdAt:
          type: string
          format: date-time
        deletionState:
          type: string
          enum: [active, requested, processing]
    SessionTokens:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, expiresAt]
      properties:
        accessToken:
          type: string
          minLength: 20
          writeOnly: true
        refreshToken:
          type: string
          minLength: 20
          writeOnly: true
        expiresAt:
          type: string
          format: date-time
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, requestId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        requestId:
          type: string
          format: uuid
